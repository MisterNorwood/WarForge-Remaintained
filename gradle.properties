# Gradle settings
org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true

# Increase HTTP timeout/retry windows for large artifact transfers (NeoForge userdev + MC decompile).
systemProp.org.gradle.internal.http.connectionTimeout = 150000
systemProp.org.gradle.internal.http.socketTimeout = 600000

## Mod metadata (consumed by build.gradle and neoforge.mods.toml processing)
modId = warforge
modName = WarForge Factions Remaintained
modGroup = com.flansmod.warforge
modVersion = 2.4.3
modArchivesBaseName = warforge-remaintained
modAuthors = Flan, MrNorwood, EightXOR8, Movblock
modDescription = Unofficial continuation of the WarForge factions mod, with new features and systems.

## Toolchain / platform versions (NeoForge 1.21.1)
minecraftVersion = 1.21.1
minecraftVersionRange = [1.21.1,1.22)
neoVersion = 21.1.248
loaderVersionRange = [1,)
# Parchment mapping export for 1.21.1 (Mojang names + parameter names)
parchmentMinecraftVersion = 1.21.1
parchmentMappingsVersion = 2024.11.17

## Dependency versions
# LDLib2 (UI framework, replaces ModularUI) — maven.firstdark.dev; ':all' classifier bundles impl + Yoga (>=2.2.1)
ldlibVersion = 2.2.26
