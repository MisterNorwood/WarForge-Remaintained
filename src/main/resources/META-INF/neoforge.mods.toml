modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/Warfactory-Offical/WarForge-Remaintained/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
logoFile=""

# Mixin configs (loaded in dev runs and from the built jar alike).
[[mixins]]
config="mixins.${mod_id}.json"

# Soft-dependency compat mixins (SBW / Ash Vehicles explosion claim fixes); CompatMixinPlugin only
# registers each one when its mod is present at runtime.
[[mixins]]
config="mixins.${mod_id}.compat.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.1,22)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"

# LDLib2 — UI framework (replaces ModularUI). TODO(UI phase): confirm exact modId and make type="required".
[[dependencies.${mod_id}]]
    modId="ldlib2"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
