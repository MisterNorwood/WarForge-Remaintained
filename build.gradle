plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'net.darkhax.curseforgegradle' version '1.1.24' apply false
    id 'com.modrinth.minotaur' version '2.8.7' apply false
}

// ---- Project coordinates (driven by gradle.properties) ----
version = project.modVersion
group = project.modGroup

base {
    archivesName = project.modArchivesBaseName
}

// Mojang ships JRE 21 to end users in 1.21.1, so mods must target Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'          // BlockBench project files
    exclude 'src/generated/**/.cache'
}


repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { // LDLib2 (UI framework) + its transitive libs
        name = 'FirstDark'
        url = 'https://maven.firstdark.dev/snapshots'
    }
    maven {
        name = 'FirstDark Releases'
        url = 'https://maven.firstdark.dev/releases'
    }
    maven { // AE2 Yoga (LDLib2 transitive) and other ecosystem libs
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven { // CurseForge artifacts (SBW, AshVehicle, JourneyMap, EffortlessBuilding)
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
    }
    maven { // GeckoLib (SBW runtime dep for dev runs)
        name = 'GeckoLib'
        url = 'https://api.cloudsmith.io/maven/geckolib3/geckolib/'
    }
    maven { // Kotlin for Forge (SBW 0.8.9 runtime dep)
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = 'Warfactory Releases'
        url = 'https://repo.warfactory.co/releases'
    }
    mavenCentral()
    mavenLocal()
}

neoForge {
    version = project.neoVersion

    // Official Mojang names + Parchment parameter/javadoc export.
    parchment {
        mappingsVersion = project.parchmentMappingsVersion
        minecraftVersion = project.parchmentMinecraftVersion
    }

    // MDG auto-detects src/main/resources/META-INF/accesstransformer.cfg (currently empty).

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }

        // Second client for local multiplayer testing (mirrors the legacy runClient2).
        client2 {
            client()
            gameDirectory = project.file('run_client2')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modId
        }

        data {
            data()
            programArguments.addAll '--mod', project.modId, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    // Bind the main source set to the mod (one entry per logical mod in the jar).
    mods {
        "${project.modId}" {
            sourceSet sourceSets.main
        }
    }
}

// localRuntime: dev-only runtime mods (SBW, GeckoLib, KFF, JourneyMap) that are NOT shipped.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ── LDLib2 — UI framework (replaces ModularUI). ':all' bundles the impl;
    //    ldlib >= 2.2.1 pulls Yoga (org.appliedenergistics.yoga) transitively. ──
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraftVersion}:${project.ldlibVersion}:all"

    compileOnly 'org.jetbrains:annotations:24.1.0'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Upgrade-config and vein config parsing use NeoForge's bundled night-config TOML
    // library (com.electronwill.nightconfig) — no extra dependency.

    // ── Soft / compat dependencies (re-enabled in their porting phases) ─────────────
    // SuperbWarfare compat mixins — 1.21.1 build is 0.8.9 (CurseForge project 1218165);
    // from 0.8.9 it requires Kotlin-for-Forge at runtime. Pin the NeoForge file id in Phase 5.
    // compileOnly "curse.maven:superb-warfare-1218165:<neo_1211_file_id>"
    // localRuntime "curse.maven:superb-warfare-1218165:<neo_1211_file_id>"
    // localRuntime "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.7"
    // localRuntime "thedarkcolour:kotlinforforge-neoforge:<ver>"

    // AshVehicle (mixin @targets only need to resolve at compile time).
    // compileOnly "curse.maven:ashvehicle-1291715:<neo_1211_file_id>"

    // JourneyMap client API (@ClientPlugin) — compileOnly; JourneyMap mod supplies runtime impl.
    // The version-stable client API is vendored in libs/; the installed JourneyMap mod provides the impl.
    compileOnly files('libs/journeymap-api-1.20.2-1.9.jar')
    // localRuntime "curse.maven:journeymap-32274:<neo_1211_file_id>"

    // EffortlessBuilding (SurvivalHelperMixin) — verify 1.21.1 NeoForge availability in Phase 5;
    // if unavailable, move SurvivalHelperMixin to the gated compat config.
    // compileOnly "curse.maven:effortlessbuilding-302113:<neo_1211_file_id>"
}

tasks.named('processResources').configure {
    var replaceProperties = [
            mod_id          : project.modId,
            mod_name        : project.modName,
            mod_version     : project.modVersion,
            mod_group       : project.modGroup,
            mod_authors     : project.modAuthors,
            mod_description : project.modDescription,
            minecraft_version: project.minecraftVersion,
            neo_version     : project.neoVersion,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar').configure {
    manifest {
        attributes([
                'Specification-Title'     : project.modId,
                'Specification-Vendor'    : project.modAuthors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.modVersion,
                'Implementation-Vendor'   : project.modAuthors,
        ])
    }
    // No reobfJar under ModDevGradle — the jar ships MojMap names natively.
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = project.modArchivesBaseName
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000', '-Xmaxwarns', '0'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def resolveReleaseType() {
    def t = (System.getenv('RELEASE_TYPE') ?: 'release').toLowerCase()
    if (!(t in ['release', 'beta', 'alpha'])) {
        throw new GradleException("RELEASE_TYPE must be release, beta, or alpha. Got: ${t}")
    }
    return t
}

def resolvePlatformChangelog() {
    def loc = System.getenv('CHANGELOG_LOCATION') ?: 'build/platform-changelog.md'
    def f = file(loc)
    return f.exists() ? f.getText('UTF-8')
            : "Automated ${resolveReleaseType()} release of ${project.modName} ${project.modVersion} for Minecraft ${project.minecraftVersion}."
}

def platformVersionName() {
    return "${project.modName} ${project.modVersion} (MC ${project.minecraftVersion})"
}

def deploymentDebug = (System.getenv('DEPLOYMENT_DEBUG') ?: 'false').toBoolean()
def cfApiKey = System.getenv('CURSEFORGE_API_KEY') ?: System.getenv('CF_API_TOKEN')
def mrApiKey = System.getenv('MODRINTH_API_KEY') ?: System.getenv('MPR_TOKEN')
def cfProjectId = System.getenv('CURSEFORGE_PROJECT_ID') ?: ''
def mrProjectId = System.getenv('MODRINTH_PROJECT_ID') ?: ''
def cfRelations = System.getenv('CURSEFORGE_RELATIONS') ?: ''
def mrRelations = System.getenv('MODRINTH_RELATIONS') ?: ''

if ((cfApiKey != null && !cfApiKey.isEmpty()) || deploymentDebug) {
    apply plugin: 'net.darkhax.curseforgegradle'
    tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = 'publishing'
        dependsOn('build')
        disableVersionDetection()
        debugMode = deploymentDebug
        apiToken = (cfApiKey ?: 'debug_token')
        doFirst {
            if (cfProjectId.isEmpty()) {
                throw new GradleException('CURSEFORGE_PROJECT_ID is not set')
            }
            def mainFile = upload(cfProjectId, tasks.jar)
            mainFile.displayName = platformVersionName()
            mainFile.releaseType = resolveReleaseType()
            mainFile.changelog = resolvePlatformChangelog()
            mainFile.changelogType = 'markdown'
            mainFile.addModLoader 'NeoForge'
            mainFile.addJavaVersion 'Java 21'
            mainFile.addGameVersion project.minecraftVersion
            if (!cfRelations.isEmpty()) {
                def typeMap = [req: 'requiredDependency', required: 'requiredDependency',
                               opt: 'optionalDependency', optional: 'optionalDependency',
                               embed: 'embeddedLibrary', embedded: 'embeddedLibrary',
                               incomp: 'incompatible', fail: 'incompatible', tool: 'tool']
                cfRelations.split(';').each { dep ->
                    if (dep.isEmpty()) return
                    def parts = dep.split(':')
                    def type = typeMap.getOrDefault(parts[0], parts[0])
                    if (!(type in ['requiredDependency', 'optionalDependency', 'embeddedLibrary', 'incompatible', 'tool'])) {
                        throw new GradleException('Invalid CurseForge dependency type: ' + parts[0])
                    }
                    mainFile.addRelation(parts[1], type)
                }
            }
            def sources = mainFile.withAdditionalFile(tasks.sourcesJar)
            sources.changelog = resolvePlatformChangelog()
        }
    }
}

if ((mrApiKey != null && !mrApiKey.isEmpty()) || deploymentDebug) {
    apply plugin: 'com.modrinth.minotaur'
    modrinth {
        token = (mrApiKey ?: 'debug_token')
        projectId = mrProjectId
        versionName = platformVersionName()
        versionNumber = project.modVersion
        versionType = resolveReleaseType()
        changelog = resolvePlatformChangelog()
        gameVersions = [project.minecraftVersion]
        loaders = ['neoforge']
        debugMode = deploymentDebug
        uploadFile = tasks.jar
        additionalFiles = [tasks.sourcesJar]
    }
    if (!mrRelations.isEmpty()) {
        def scopeMap = [req: 'required', required: 'required', opt: 'optional', optional: 'optional',
                        embed: 'embedded', embedded: 'embedded', incomp: 'incompatible', fail: 'incompatible']
        mrRelations.split(';').each { dep ->
            if (dep.isEmpty()) return
            def parts = dep.split(':')
            def qual = parts[0].split('-')
            def scope = scopeMap.getOrDefault(qual[0], qual[0])
            if (!(scope in ['required', 'optional', 'incompatible', 'embedded'])) {
                throw new GradleException('Invalid Modrinth dependency scope: ' + qual[0])
            }
            def kind = qual.length > 1 ? qual[1] : 'project'
            if (kind in ['proj', 'p', 'project']) {
                project.modrinth.dependencies.add(new com.modrinth.minotaur.dependencies.ModDependency(parts[1], scope))
            } else if (kind in ['ver', 'v', 'version']) {
                project.modrinth.dependencies.add(new com.modrinth.minotaur.dependencies.VersionDependency(parts[1], scope))
            } else {
                throw new GradleException('Invalid Modrinth dependency kind: ' + kind)
            }
        }
    }
    tasks.named('modrinth').configure { dependsOn('build') }
}

tasks.register('releaseBuild') {
    group = 'build'
    description = 'Builds the release jar for CurseForge/Modrinth publishing.'
    dependsOn('build')
}
